<button onclick="submitReport()">Submit Report</button>

<script>
function submitReport() {
    fetch("http://localhost:8000/api/report", {
        method: "POST"
    })
    .then(response => response.json())
    .then(data => {
        alert("Report ID: " + data.report_id);
    })
    .catch(error => {
        console.log(error);
        alert("Submission failed");
    });
}
</script>
